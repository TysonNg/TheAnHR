appId: vn.thean.hr
productName: TheAnHR
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/ocr
    to: ocr
asarUnpack:
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
win:
  target: nsis
  artifactName: TheAnHR-Setup-${version}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

